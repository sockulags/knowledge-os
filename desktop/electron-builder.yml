appId: se.lucasskog.knowledgeos
productName: Knowledge OS
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!core/*'
  - '!scripts/*'
  - '!resources/**'
  - '!build-core/**'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{vitest.config.ts,eslint.config.mjs,.eslintcache,.prettierignore,.prettierrc.yaml,README.md}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
# The frozen core (npm run build:core) ships next to app.asar as
# resources/core/kos-core.exe; the shell finds it through process.resourcesPath.
extraResources:
  - from: build-core/dist/kos-core
    to: core
# The kos.cmd shim (see resources/bin/kos.cmd) ships at <install dir>\bin, not
# under resources\, so the folder the installer adds to PATH holds only the
# shim.
extraFiles:
  - from: resources/bin
    to: bin
# Updates come from this repository's GitHub releases. electron-builder writes
# the feed into the app as app-update.yml and, next to the installer,
# latest.yml and the blockmap that each release must publish; `npm run dist`
# passes --publish never, so building never uploads anything.
# No win.signtoolOptions/publisherName: the installer is unsigned, and without
# a publisherName in app-update.yml electron-updater skips the publisher check
# (see src/main/updater.ts and desktop/README.md).
publish:
  provider: github
  owner: sockulags
  repo: knowledge-os
# The app icon (build/icon.ico, generated from build/icon.svg by
# `npm run icon`): the .exe, and through it the Start menu and desktop
# shortcuts and the taskbar; the installer and uninstaller carry the same
# icon. The windows set it too (src/main/index.ts).
win:
  executableName: knowledge-os
  target: nsis
  icon: build/icon.ico
nsis:
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  installerHeaderIcon: build/icon.ico
  # Version-less artifact name, as in Referat, so a latest-download link never rots.
  artifactName: knowledge-os-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
  # Per-user install without an elevation prompt.
  oneClick: true
  perMachine: false
  runAfterFinish: true
  # Adds/removes <install dir>\bin (the kos.cmd shim) on the user PATH; see
  # build/installer.nsh.
  include: build/installer.nsh
npmRebuild: false
# Electron fuses, flipped in the packaged knowledge-os.exe (see "Electron
# fuses" in desktop/README.md). Dev runs (npm run dev, npm start) use the
# stock Electron binary and are unaffected.
electronFuses:
  # The in-app agents' ACP adapters run as Electron-as-Node
  # (ELECTRON_RUN_AS_NODE, src/main/agents/service.ts), so this stays on.
  runAsNode: true
  enableCookieEncryption: true
  # Nothing the app or its adapters start passes NODE_OPTIONS or --inspect;
  # turned off, neither can inject code into the app or an adapter. Child
  # processes still inherit NODE_OPTIONS and NODE_EXTRA_CA_CERTS.
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  # The app loads only from app.asar, whose header hash electron-builder
  # embeds in the .exe and Electron checks at start.
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
  # grantFileProtocolExtraPrivileges stays at Electron's default: the start
  # page is a file:// page with module scripts, which would need testing.
