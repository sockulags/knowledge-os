name: Release

# Builds the Windows installer exactly as `npm run dist` does on a developer's
# computer (see "Releasing a new version" in desktop/README.md), from a clean
# checkout. Run it by hand from the Actions tab:
# - publish: false (the default) only builds, and uploads the three files as a
#   workflow artifact to try out;
# - publish: true also creates the GitHub release vX.Y.Z (the version in
#   desktop/package.json) on the checked-out commit, with the installer,
#   latest.yml, and the blockmap attached, and publishes it, so installed apps
#   find the update at their next check.
# The installer is unsigned (issue #87).

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the GitHub release after building
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      # scripts/build-core.ps1 creates its venv with `py -3.11` only when the
      # venv does not exist yet; create it with the Python set up above.
      - name: Create the core build venv
        shell: pwsh
        run: python -m venv desktop/build-core/venv
      - name: Check the versions match
        shell: pwsh
        run: |
          $app = (Get-Content desktop/package.json -Raw | ConvertFrom-Json).version
          $core = python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])"
          if ($app -ne $core) { throw "desktop/package.json is $app but pyproject.toml is $core" }
          "VERSION=$app" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Build (npm ci, npm run dist)
        working-directory: desktop
        run: |
          npm ci
          npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: knowledge-os-${{ env.VERSION }}-windows
          path: |
            desktop/dist/knowledge-os-setup.exe
            desktop/dist/knowledge-os-setup.exe.blockmap
            desktop/dist/latest.yml
          if-no-files-found: error
      - name: Publish the release
        if: ${{ inputs.publish }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$env:VERSION" `
            desktop/dist/knowledge-os-setup.exe `
            desktop/dist/latest.yml `
            desktop/dist/knowledge-os-setup.exe.blockmap `
            --target "$env:GITHUB_SHA" --title "Knowledge OS $env:VERSION" --generate-notes
