[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "knowledge-os"
version = "0.5.0"
description = "Local-first filesystem-native durable knowledge tools"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6,<7"]

[project.optional-dependencies]
reader = ["starlette>=0.37", "uvicorn>=0.30", "markdown-it-py>=3", "pygments>=2.17"]
mcp = ["mcp>=2.2,<3"]

[project.scripts]
kos = "knowledge_os.cli:main"
kos-read = "knowledge_os.reader.cli:main"

[tool.setuptools.packages.find]
include = ["knowledge_os*"]

[tool.setuptools.package-data]
"knowledge_os.reader" = ["static/app/index.html", "static/app/assets/*"]
